name: Schwimmen
abteilung: Freizeitsport
gruppe: Kinder/Jugend
reihenfolge: 130
beschreibung: |-
  „Im Anfängerkurs wollen wir den Kindern Erlebnisse, Erfahrungen und den Spaß am Wasser vermitteln.
  So lernen sie, sich ohne Hilfsmittel und ohne Angst eine Zeit lang beliebig im Wasser
  fortzubewegen. Für die Teilnahme am Kurs sollen die Kinder die Wassergewöhnung abgeschlossen
  haben. Hierzu gehört auch, dass sie den Kopf unter Wasser nehmen können.

  In den Aufbaukursen vertiefen wir die bereits gelernten Fähigkeiten. Während der Kurse bleibt auch
  immer noch ein wenig Zeit zum Spielen, was allen großen Spaß macht. Begehrtes Ziel unserer Kurse
  ist natürlich das Seepferdchen.“

  Kursbeginn: Januar, April und September.
