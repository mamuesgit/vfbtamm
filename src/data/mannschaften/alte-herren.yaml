gruppe: Aktive
reihenfolge: 50
teamfoto: /uploads/2025/06/2025_ah-turnier_mannschaftsbild.webp
beschreibung: >-
  Die AH ist ein kleiner Teil der Fußballabteilung mit ca. 35 aktiven Spielern sowie einigen
  passiven Mitgliedern zwischen 30 und 60 Jahren. Alle, die noch Spaß am Fußball haben, werden
  gerne aufgenommen. Wir nehmen im Laufe des Jahres an dem einen oder anderen Turnier teil.
  Zudem bestreiten wir noch Freundschaftsspiele gegen befreundete Vereine. Für Freundschaftsspiele
  gegen neue Mannschaften sind wir gerne bereit. Selbst nach Griechenland zu einem Ausflug mit
  einem Spiel ist der Weg nicht zu weit. Weitere Aktivitäten sind: Skiausfahrten, Wanderungen,
  AH-Ausflug etc.
