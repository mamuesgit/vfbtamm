# Sveltia CMS – Redaktion unter /admin
# Autoren bearbeiten hier ausschließlich Beiträge. Mannschaften, Vorstand, Sponsoren usw.
# werden bewusst nicht im CMS angezeigt (siehe CLAUDE.md).

backend:
  name: github
  repo: mamuesgit/vfbtamm
  branch: main
  # Login-Worker (sveltia-cms-auth) bei Cloudflare – URL nach dem Einrichten eintragen
  base_url: https://sveltia-cms-auth.mamuesmailbox.workers.dev
  # Nur „Mit GitHub anmelden“ anbieten (kein Zugriffstoken)
  auth_methods: [oauth]
  commit_messages:
    create: 'Beitrag erstellt: {{slug}}'
    update: 'Beitrag geändert: {{slug}}'
    delete: 'Beitrag gelöscht: {{slug}}'
    uploadMedia: 'Bild hochgeladen: {{path}}'
    deleteMedia: 'Bild gelöscht: {{path}}'

app_title: VfB Tamm – Redaktion
logo:
  src: /logo.png

# Neue Bilder landen in public/uploads/beitraege/ (alte Bilder liegen in public/uploads/JJJJ/MM/)
media_folder: public/uploads
public_folder: /uploads

media_libraries:
  default:
    config:
      slugify_filename: true
      max_file_size: 26214400 # 25 MB vor der Verkleinerung
      transformations:
        # Jedes Foto wird im Browser auf max. 1600 px verkleinert und als WebP gespeichert
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600
  # Keine Bilddatenbanken von Drittanbietern (Unsplash, Pexels …)
  stock_assets: false

slug:
  encoding: ascii
  clean_accents: true
  timezone: local
  maxlength: 80

output:
  # Leere optionale Felder (z. B. kein Titelbild) nicht als leeren Wert speichern
  omit_empty_optional_fields: true

collections:
  - name: beitraege
    label: Beiträge
    label_singular: Beitrag
    description: >-
      Neuigkeiten und Spielberichte. Nach dem Veröffentlichen ist der Beitrag nach etwa
      einer Minute auf der Website sichtbar.
    folder: src/content/beitraege
    media_folder: /public/uploads/beitraege
    public_folder: /uploads/beitraege
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    preview_path: 'beitraege/{{slug}}/'
    summary: "{{title}} · {{abteilung}} · {{date | date('DD.MM.YYYY')}}"
    thumbnail: cover
    sortable_fields:
      fields: [date, title, abteilung]
      default:
        field: date
        direction: descending
    view_filters:
      filters:
        - { name: hauptverein, label: Hauptverein, field: abteilung, eq: Hauptverein }
        - { name: fussball, label: Fußball, field: abteilung, eq: Fußball }
        - { name: freizeitsport, label: Freizeitsport, field: abteilung, eq: Freizeitsport }
        - { name: tischtennis, label: Tischtennis, field: abteilung, eq: Tischtennis }
    fields:
      - name: title
        label: Titel
        widget: string
        hint: 'Bei Spielberichten mit der Mannschaft beginnen, z. B. „Herren 1: VfB Tamm – TSV Musterstadt 2:1 (1:0)“.'
      - name: date
        label: Datum
        widget: datetime
        default: '{{now}}'
        format: 'YYYY-MM-DDTHH:mm:ss'
        input_timezone: local
        output_utc: false
      - name: abteilung
        label: Abteilung
        widget: select
        options: [Hauptverein, Fußball, Freizeitsport, Tischtennis]
        hint: Bestimmt, auf welcher Seite und in welchem Block der Startseite der Beitrag erscheint.
      - name: cover
        label: Titelbild
        widget: image
        required: false
        choose_url: false
        hint: Wird oben im Beitrag und in den Beitragslisten angezeigt.
      - name: gallery
        label: Bildergalerie
        widget: image
        multiple: true
        required: false
        choose_url: false
        hint: Weitere Bilder, die unter dem Text als Galerie erscheinen.
      - name: body
        label: Text
        widget: markdown
        buttons: [bold, italic, link, bulleted-list, numbered-list]
        editor_components: []
        modes: [rich_text]
